name: Build Releon

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip Source Code
        run: |
          mkdir -p unpacked
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          unzip -o "$ZIP_FILE" -d unpacked
          ls -la unpacked

      - name: Download Assets from Release
        run: |
          # ВАЖНО: Замени кавычки ниже на ссылку, которую ты скопировал!
          wget -O assets.zip "ВСТАВЬ_СВОЮ_ССЫЛКУ"
          
          RES_DIR=$(find unpacked -type d -path "*/src/main/resources" | head -1)
          unzip -o assets.zip -d "$RES_DIR"
          echo "Текстуры распакованы в $RES_DIR"

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          cd unpacked
          DIR=$(find . -name "build.gradle" -not -path "*/build/*" -not -path "*/.gradle/*" | head -1 | xargs dirname)
          cd "$DIR"
          sed -i '/org.gradle.java.home/d' gradle.properties || true
          gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: releon-jar
          path: 'unpacked/**/build/libs/*.jar'
